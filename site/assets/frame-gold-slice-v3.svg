<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6d4810"/>
    <stop offset=".14" stop-color="#d6aa3a"/>
    <stop offset=".31" stop-color="#fff0a2"/>
    <stop offset=".46" stop-color="#c28d22"/>
    <stop offset=".63" stop-color="#f7d96d"/>
    <stop offset=".82" stop-color="#8a5b11"/>
    <stop offset="1" stop-color="#e6bd4b"/>
  </linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bb8420"/>
    <stop offset=".5" stop-color="#6f4810"/>
    <stop offset="1" stop-color="#d2a53a"/>
  </linearGradient>
  <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b"/>
    <feSpecularLighting in="b" surfaceScale="4" specularConstant=".8" specularExponent="14" lighting-color="#fff4b8" result="s">
      <feDistantLight azimuth="225" elevation="55"/>
    </feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="si"/></feMerge>
  </filter>
  <g id="leaf" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#emboss)">
    <path stroke-width="9" d="M7 42 C16 12 42 7 67 15 C51 21 40 33 34 51 C28 43 19 40 7 42Z"/>
    <path stroke-width="7" d="M19 49 C35 40 50 40 65 51"/>
    <path stroke-width="6" d="M31 22 C40 29 45 36 47 44"/>
  </g>
  <g id="curl" fill="none" stroke="url(#gold)" stroke-linecap="round" filter="url(#emboss)">
    <path stroke-width="8" d="M4 45 C12 13 55 4 70 25 C82 42 65 61 47 55 C35 51 33 37 42 31 C51 24 61 31 59 40"/>
  </g>
  <g id="corner" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#emboss)">
    <path stroke-width="10" d="M8 78 C13 37 37 13 78 8"/>
    <path stroke-width="7" d="M16 69 C28 42 42 28 69 16"/>
    <path stroke-width="7" d="M27 62 C32 44 44 32 62 27"/>
    <circle cx="24" cy="24" r="10" fill="#d7ad42" stroke="#754b0d" stroke-width="4"/>
  </g>
</defs>

<!-- frame body: the central 180x180 region remains fully transparent -->
<path d="M0 0H360V360H0Z M90 90H270V270H90Z" fill="url(#gold)" fill-rule="evenodd"/>
<rect x="8" y="8" width="344" height="344" fill="none" stroke="#6f480d" stroke-width="8"/>
<rect x="22" y="22" width="316" height="316" fill="none" stroke="#f5dd7c" stroke-width="5"/>
<rect x="36" y="36" width="288" height="288" fill="none" stroke="url(#dark)" stroke-width="12"/>
<rect x="53" y="53" width="254" height="254" fill="none" stroke="#fff0a0" stroke-width="4"/>
<rect x="67" y="67" width="226" height="226" fill="none" stroke="#754b0d" stroke-width="8"/>
<rect x="80" y="80" width="200" height="200" fill="none" stroke="#edcf69" stroke-width="7"/>

<use href="#corner" x="0" y="0"/>
<use href="#corner" transform="translate(360 0) scale(-1 1)"/>
<use href="#corner" transform="translate(0 360) scale(1 -1)"/>
<use href="#corner" transform="translate(360 360) scale(-1 -1)"/>

<g transform="translate(92 14)">
  <use href="#leaf" x="0"/><use href="#curl" x="62"/><use href="#leaf" x="112"/>
</g>
<g transform="translate(268 346) rotate(180)">
  <use href="#leaf" x="0"/><use href="#curl" x="62"/><use href="#leaf" x="112"/>
</g>
<g transform="translate(14 92) rotate(90)">
  <use href="#leaf" x="0"/><use href="#curl" x="62"/><use href="#leaf" x="112"/>
</g>
<g transform="translate(346 268) rotate(-90)">
  <use href="#leaf" x="0"/><use href="#curl" x="62"/><use href="#leaf" x="112"/>
</g>
</svg>